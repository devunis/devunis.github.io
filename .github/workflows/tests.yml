name: Portfolio tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Tests use Node's standard library and mock provider requests.
      # No dependency installation, API keys or deployment credentials are needed.
      - name: Run chatbot, Worker and date regression tests
        run: npm test
